[project]
name = "messy-data-eda"
version = "0.1.0"
description = "Messy real-world e-commerce sales data: cleaning pipeline, EDA, documented decisions and a data dictionary."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "seaborn>=0.13.2",
    "tabulate>=0.10.0",
]

# Console entry points need a real build backend: a uv virtual project
# ([tool.uv] package = false) installs nothing, so the documented command fails
# with "No module named ..." even while tests pass (pytest's pythonpath hides it).
[project.scripts]
messy-data-eda = "messydataeda.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Keep this path and the [project.scripts] target above in step when renaming the package.
[tool.hatch.build.targets.wheel]
packages = ["src/messydataeda"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
